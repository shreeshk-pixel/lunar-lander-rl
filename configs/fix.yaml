# Documentation of a published training variant.
# src/train.py does not accept --config; these values were passed on the CLI
# (or taken from script/wrapper defaults). Re-run with the same flags, or with
# scripts/run_*.sh and the env overrides listed in the README.

name: fix
wrapper: fix                # PotentialShapingFix: r + γΦ(s') − Φ(s) − fee
wrapper_kwargs: {}          # constructor defaults used in the published runs
fix_defaults:
  scale: 1.0                # Φ(s) = scale · 1[upright and slow]
  gamma: 0.999              # must equal PPO gamma (see ppo.gamma below)
  fee: 0.05                 # per-frame fee; at most −50 over 1000 steps
  max_angle: 0.2
  max_speed: 0.3
policy: MlpPolicy
algo: PPO
env_id: LunarLander-v3
timesteps: 1000000          # requested; 8 envs × n_steps=1024 → 1,007,616 actual
n_envs: 8
device: cpu
torch_threads: 1
seeds: [0, 1, 2]            # published training seeds
ppo:
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999
  gae_lambda: 0.98
  ent_coef: 0.01
  learning_rate: 0.0003
